server.port=4000
spring.main.banner-mode=off
spring.main.lazy-initialization=false

# Broadcast a timerUpdate SSE event every second while the timer is running.
# Disable to reduce SSE traffic (clients will only receive updates on state transitions and expiry).
pomodoro.sse.ticks-enabled=true

# When true, browser extension navigates blocked tabs back to their previous page when focus ends.
# When false, tabs remain on the blocked.html interstitial.
pomodoro.blocking.restore-tabs=false
